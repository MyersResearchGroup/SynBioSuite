        explode: false
        in: header
        name: X-SynBioHub-Url
        required: false
        schema:
          example: https://api.synbiohub.org
          format: uri
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Item"
                type: array
            application/rdf+xml:
              schema:
                format: binary
                type: string
          description: |
            All contents of the collection. An empty array means the collection exists but has no members -- including the case where the study has no such sub-collection yet.
        "400":
