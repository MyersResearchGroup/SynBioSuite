  /assays:
    delete:
      description: |
        Removes every member from the collection. The sub-collection object itself survives, and the SBOL objects are not destroyed -- only their membership is removed. A subsequent GET returns an empty array.
      operationId: clear_assays
      parameters:
      - description: |
          The SynBioHub collection URI of the study the request applies to -- the study the user selects when opening SynBioSuite. This scopes every collection to one study, which is why no per-item ids are needed elsewhere in this API. Must be of the form <scheme>://<host>/user/<user>/<studyId>/<displayId>/<version>.
        explode: false
        in: header
        name: X-Study-Collection
        required: true
        schema:
          example: https://synbiohub.org/user/alice/MyStudy/MyStudy_collection/1
          format: uri
          type: string
        style: simple
      - description: |
