openapi: 3.0.3
info:
  description: |
    Bulk, collection-level REST API for SynBioSuite. Each collection exposes GET (get all contents), POST (add), PUT (replace all contents), and DELETE (empty). Excel-backed collections also expose GET /template.

    Per-item access (fetch or edit a single object by id) is delegated to the SynBioHub API, which is the system of record for individual objects. The one exception is PATCH /assays/{display_id}/attachments, which attaches a file to a specific SBOL object and therefore must name that object.

    Every request carries the study it applies to in the X-Study-Collection header (the SynBioHub collection selected when opening SynBioSuite). That study scopes all collections, which is why this API needs no per-item ids elsewhere. Because the SynBioHub API host differs from the host in that collection URI (api.synbiohub.org vs synbiohub.org), the API base is supplied separately in X-SynBioHub-Url.

    Uploads take a single `file` part. Collections that accept both formats detect which from the file extension; Excel is converted to SBOL on ingest.

    DELETE empties a collection by removing its members' membership. The sub-collection object survives and the SBOL objects themselves are not destroyed, so a subsequent GET returns an empty array rather than 404. A 404 means the study collection itself does not exist.

    This version number is the API contract's; GET /status reports the running backend's version, which is tracked separately.

    TBD collections, present but not yet specified: /models (SBML), /archives (OMEX), /analyses (iBioSim). They answer 501.

    Trying it out: open these docs from a running server, click Authorize and paste a SynBioHub token, then on any operation click Try it out, paste your study's collection URI into X-Study-Collection, and Execute. Leave X-SynBioHub-Url blank -- the server derives https://api.<study host>. PUT and DELETE change real data; point them at a scratch study.
  title: SynBioSuite API
  version: 1.0.0
servers:
- description: The server hosting these docs
  url: /api/v1
- description: Local SBS server
  url: http://127.0.0.1:5003/api/v1
security:
- bearerAuth: []
tags:
- name: System
- name: Resources
- name: Devices
- name: Designs
- name: Plasmids
- name: Strains
- name: Sample Designs
- name: Assays
- name: Models
- name: Archives
- name: Analyses
paths:
  /analyses:
    delete:
      operationId: clear_analyses
      parameters:
      - description: |
          The SynBioHub collection URI of the study the request applies to -- the study the user selects when opening SynBioSuite. This scopes every collection to one study, which is why no per-item ids are needed elsewhere in this API. Must be of the form <scheme>://<host>/user/<user>/<studyId>/<displayId>/<version>.
        explode: false
        in: header
        name: X-Study-Collection
        required: true
        schema:
          example: https://synbiohub.org/user/alice/MyStudy/MyStudy_collection/1
          format: uri
          type: string
        style: simple
      - description: |
          Base URL of the SynBioHub API to talk to. This is a different host from the one in X-Study-Collection (api.synbiohub.org vs synbiohub.org), so it cannot be derived from it reliably. Falls back to the server's SBS_SBH_URL setting, then to https://api.<study host>. Whichever is used must be an http(s) URL with no query string, fragment or credentials, and its host must resolve to a public address; otherwise the request fails with 400 before anything is sent. The server's own SBS_SBH_URL origin is exempt from the public-address rule, so a local SynBioHub works in development.
        explode: false
        in: header
        name: X-SynBioHub-Url
        required: false
        schema:
          example: https://api.synbiohub.org
          format: uri
          type: string
        style: simple
      responses:
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: |
            Invalid request -- a malformed X-Study-Collection header, a missing file part, an unreadable file, or a workbook that is not a valid Excel-to-SBOL template.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid SynBioHub credentials.
        "501":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: This collection is not specified yet.
      summary: "[TBD] Empty the analyses collection"
      tags:
      - Analyses
      x-openapi-router-controller: openapi_server.controllers.analyses_controller
    get:
