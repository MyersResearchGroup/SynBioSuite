          example: https://synbiohub.org/user/alice/MyStudy/MyStudy_collection/1
          format: uri
          type: string
        style: simple
      - description: |
          Base URL of the SynBioHub API to talk to. This is a different host from the one in X-Study-Collection (api.synbiohub.org vs synbiohub.org), so it cannot be derived from it reliably. Falls back to the server's SBS_SBH_URL setting, then to https://api.<study host>. Whichever is used must be an http(s) URL with no query string, fragment or credentials, and its host must resolve to a public address; otherwise the request fails with 400 before anything is sent. The server's own SBS_SBH_URL origin is exempt from the public-address rule, so a local SynBioHub works in development.
        explode: false
        in: header
        name: X-SynBioHub-Url
        required: false
        schema:
          example: https://api.synbiohub.org
          format: uri
          type: string
        style: simple
      responses:
        "200":
          content:
            application/vnd.ms-excel.sheet.macroEnabled.12:
              schema:
                format: binary
                type: string
          description: |
            A blank macro-enabled Excel template (.xlsm). Data rows are empty; SBH_* lookup sheets are populated from the study.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: |
            Invalid request -- a malformed X-Study-Collection header, a missing file part, an unreadable file, or a workbook that is not a valid Excel-to-SBOL template.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid SynBioHub credentials.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: |
            The study collection named in X-Study-Collection does not exist, or -- for the per-item endpoint -- no such object exists in this collection. An empty collection is not a 404; it is a 200 with an empty array.
        "502":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: SynBioHub rejected the request or could not be reached.
      summary: Download the blank Excel template for strains
      tags:
      - Strains
      x-openapi-router-controller: openapi_server.controllers.strains_controller
components:
  parameters:
    StudyCollection:
      description: |
        The SynBioHub collection URI of the study the request applies to -- the study the user selects when opening SynBioSuite. This scopes every collection to one study, which is why no per-item ids are needed elsewhere in this API. Must be of the form <scheme>://<host>/user/<user>/<studyId>/<displayId>/<version>.
      explode: false
      in: header
      name: X-Study-Collection
      required: true
      schema:
        example: https://synbiohub.org/user/alice/MyStudy/MyStudy_collection/1
        format: uri
        type: string
      style: simple
    SynBioHubUrl:
      description: |
        Base URL of the SynBioHub API to talk to. This is a different host from the one in X-Study-Collection (api.synbiohub.org vs synbiohub.org), so it cannot be derived from it reliably. Falls back to the server's SBS_SBH_URL setting, then to https://api.<study host>. Whichever is used must be an http(s) URL with no query string, fragment or credentials, and its host must resolve to a public address; otherwise the request fails with 400 before anything is sent. The server's own SBS_SBH_URL origin is exempt from the public-address rule, so a local SynBioHub works in development.
      explode: false
      in: header
      name: X-SynBioHub-Url
      required: false
      schema:
        example: https://api.synbiohub.org
        format: uri
        type: string
      style: simple
  requestBodies:
    FileUpload:
      content:
        multipart/form-data:
          schema:
            $ref: "#/components/schemas/replaceResources_request"
      description: |
        A file -- an Excel template (.xlsx/.xlsm) or SBOL XML (.xml/.rdf/.sbol), depending on what the collection accepts -- plus an optional JSON params blob for processing options. Excel is converted to SBOL on the way in. Which format was sent is determined from the file extension. The target study comes from the X-Study-Collection header, not from params.
      required: true
    AttachmentUpload:
      content:
        multipart/form-data:
          schema:
            $ref: "#/components/schemas/attachToAssay_request"
      description: A file to attach to one SBOL object.
      required: true
  responses:
    CollectionContents:
      content:
        application/json:
          schema:
            items:
              $ref: "#/components/schemas/Item"
            type: array
        application/rdf+xml:
          schema:
            format: binary
            type: string
      description: |
        All contents of the collection. An empty array means the collection exists but has no members -- including the case where the study has no such sub-collection yet.
    MutationAccepted:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MutationResult"
      description: "The upload, replace, or attach succeeded."
    TemplateFile:
      content:
        application/vnd.ms-excel.sheet.macroEnabled.12:
          schema:
            format: binary
            type: string
      description: |
        A blank macro-enabled Excel template (.xlsm). Data rows are empty; SBH_* lookup sheets are populated from the study.
    BadRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: |
        Invalid request -- a malformed X-Study-Collection header, a missing file part, an unreadable file, or a workbook that is not a valid Excel-to-SBOL template.
    Unauthorized:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: Missing or invalid SynBioHub credentials.
    Forbidden:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: Not permitted (e.g. you do not own this collection).
    NotFound:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: |
        The study collection named in X-Study-Collection does not exist, or -- for the per-item endpoint -- no such object exists in this collection. An empty collection is not a 404; it is a 200 with an empty array.
    UnsupportedMediaType:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: |
        The file's format is not one this collection accepts (e.g. an Excel workbook posted to an SBOL-only collection).
    PayloadTooLarge:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: |
        The upload is larger than the server accepts. The limit is MAX_CONTENT_LENGTH, 64 MB by default; set SBS_MAX_UPLOAD_MB to change it per deployment.
    NotImplemented:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: This collection is not specified yet.
    BadGateway:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: SynBioHub rejected the request or could not be reached.
    GatewayTimeout:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: |
        SynBioHub did not answer in time. For a submit, whether the upload was applied is unknown -- SynBioHub may still finish it -- and sending the same request again is safe. Also returned when a workbook's Tyto Lookup columns need Ontobee and it did not answer.
  schemas:
    Status:
      example:
        status: working
        version: 1.9.0
      properties:
        status:
          example: working
          title: status
          type: string
        version:
          description: The running backend's version.
          example: 1.9.0
          title: version
          type: string
      title: Status
      type: object
    Item:
      additionalProperties: true
      description: One object in a collection. Fields are collection-dependent.
      example:
        uri: https://openapi-generator.tech
        displayId: displayId
        name: name
        description: description
        type:
        - type
        - type
        role:
        - role
        - role
      properties:
        uri:
          format: uri
          type: string
        displayId:
          type: string
        name:
          type: string
        description:
          type: string
        type:
          description: "SBOL types. Multi-valued, so always an array."
          items:
            type: string
          type: array
        role:
          description: "SBOL roles. Multi-valued, so always an array."
          items:
            type: string
          type: array
      title: Item
      type: object
    Error:
      example:
        error: error
      properties:
        error:
          title: error
          type: string
      title: Error
      type: object
    MutationResult:
      example:
        status: success
        message: message
      properties:
        status:
          example: success
          title: status
          type: string
        message:
          title: message
          type: string
      title: MutationResult
      type: object
    replaceResources_request:
      properties:
        file:
          format: binary
          type: string
        params:
          description: Optional JSON string of processing parameters.
          type: string
      required:
      - file
      type: object
    attachToAssay_request:
      properties:
        file:
          description: The attachment to add.
          format: binary
          type: string
      required:
      - file
      type: object
  securitySchemes:
    bearerAuth:
      description: |
        SynBioHub access token. The server forwards it to SynBioHub as the X-authorization header that SynBioHub itself expects.
      scheme: bearer
      type: http
      x-bearerInfoFunc: openapi_server.controllers.security_controller.info_from_bearerAuth
