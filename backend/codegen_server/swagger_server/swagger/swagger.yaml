        required: false
        style: simple
        explode: false
        schema:
          type: string
          format: uri
          example: https://api.synbiohub.org
      requestBody:
        $ref: "#/components/requestBodies/FileUpload"
      responses:
        "201":
          description: "The upload, replace, or attach succeeded."
          content:
