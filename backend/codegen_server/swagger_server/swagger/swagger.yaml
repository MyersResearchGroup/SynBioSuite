openapi: 3.0.3
info:
  title: SynBioSuite API
  description: |
    Bulk, collection-level REST API for SynBioSuite. Each collection exposes GET (get all contents), POST (add), PUT (replace all contents), and DELETE (empty). Excel-backed collections also expose GET /template.

    Per-item access (fetch or edit a single object by id) is delegated to the SynBioHub API, which is the system of record for individual objects. The one exception is PATCH /assays/{id}/attachments, which attaches a file to a specific SBOL object and therefore must name that object.

    Every request carries the study it applies to in the X-Study-Collection header (the SynBioHub collection selected when opening SynBioSuite). That study scopes all collections, which is why this API needs no per-item ids elsewhere. Because the SynBioHub API host differs from the host in that collection URI (api.synbiohub.org vs synbiohub.org), the API base is supplied separately in X-SynBioHub-Url.

    Uploads take a single `file` part. Collections that accept both formats detect which from the file extension; Excel is converted to SBOL on ingest.

    DELETE empties a collection by removing its members' membership. The sub-collection object survives and the SBOL objects themselves are not destroyed, so a subsequent GET returns an empty array rather than 404. A 404 means the study collection itself does not exist.

    This version number is the API contract's; GET /status reports the running backend's version, which is tracked separately.

    TBD collections, present but not yet specified: /models (SBML), /archives (OMEX), /analyses (iBioSim). They answer 501.

    Trying it out: open these docs from a running server, click Authorize and paste a SynBioHub token, then on any operation click Try it out, paste your study's collection URI into X-Study-Collection, and Execute. Leave X-SynBioHub-Url blank -- the server derives https://api.<study host>. PUT and DELETE change real data; point them at a scratch study.
  version: 1.0.0
servers:
- url: /api/v1
  description: The server hosting these docs
- url: http://127.0.0.1:5003/api/v1
  description: Local SBS server
security:
- bearerAuth: []
tags:
- name: System
- name: Resources
- name: Devices
- name: Designs
- name: Plasmids
- name: Strains
- name: Sample Designs
- name: Assays
- name: Models
- name: Archives
- name: Analyses
paths:
  /status:
    get:
      tags:
      - System
      summary: Check the API is running
      operationId: get_status
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
      security: []
      x-openapi-router-controller: swagger_server.controllers.system_controller
  /resources:
    get:
      tags:
      - Resources
      summary: Get all the contents of the resources collection
      description: |
        Returns an empty array when the study has no such sub-collection yet, which is the normal state of a freshly created study.
      operationId: list_resources
      parameters:
      - name: X_Study_Collection
        in: header
        description: |
          The SynBioHub collection URI of the study the request applies to -- the study the user selects when opening SynBioSuite. This scopes every collection to one study, which is why no per-item ids are needed elsewhere in this API. Must be of the form <scheme>://<host>/user/<user>/<studyId>/<displayId>/<version>.
        required: true
        style: simple
        explode: false
        schema:
          type: string
          format: uri
          example: https://synbiohub.org/user/alice/MyStudy/MyStudy_collection/1
      - name: X_SynBioHub_Url
        in: header
        description: |
          Base URL of the SynBioHub API to talk to. This is a different host from the one in X-Study-Collection (api.synbiohub.org vs synbiohub.org), so it cannot be derived from it reliably. Falls back to the server's SBS_SBH_URL setting, then to https://api.<study host>. Whichever is used must be an http(s) URL with no query string, fragment or credentials, and its host must resolve to a public address; otherwise the request fails with 400 before anything is sent. The server's own SBS_SBH_URL origin is exempt from the public-address rule, so a local SynBioHub works in development.
        required: false
        style: simple
        explode: false
        schema:
          type: string
          format: uri
          example: https://api.synbiohub.org
      responses:
        "200":
          description: |
            All contents of the collection. An empty array means the collection exists but has no members -- including the case where the study has no such sub-collection yet.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Item"
                x-content-type: application/json
            application/rdf+xml:
              schema:
                type: string
                format: binary
        "400":
          description: |
            Invalid request -- a malformed X-Study-Collection header, a missing file part, an unreadable file, or a workbook that is not a valid Excel-to-SBOL template.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid SynBioHub credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: |
            The study collection named in X-Study-Collection does not exist, or -- for the per-item endpoint -- no such object exists in this collection. An empty collection is not a 404; it is a 200 with an empty array.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: SynBioHub rejected the request or could not be reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-openapi-router-controller: swagger_server.controllers.resources_controller
    put:
      tags:
      - Resources
      summary: Replace the resources collection contents
      description: |
        After this call the collection contains exactly what was uploaded.
      operationId: replace_resources
      parameters:
      - name: X_Study_Collection
        in: header
        description: |
          The SynBioHub collection URI of the study the request applies to -- the study the user selects when opening SynBioSuite. This scopes every collection to one study, which is why no per-item ids are needed elsewhere in this API. Must be of the form <scheme>://<host>/user/<user>/<studyId>/<displayId>/<version>.
        required: true
        style: simple
        explode: false
        schema:
          type: string
          format: uri
          example: https://synbiohub.org/user/alice/MyStudy/MyStudy_collection/1
      - name: X_SynBioHub_Url
        in: header
        description: |
          Base URL of the SynBioHub API to talk to. This is a different host from the one in X-Study-Collection (api.synbiohub.org vs synbiohub.org), so it cannot be derived from it reliably. Falls back to the server's SBS_SBH_URL setting, then to https://api.<study host>. Whichever is used must be an http(s) URL with no query string, fragment or credentials, and its host must resolve to a public address; otherwise the request fails with 400 before anything is sent. The server's own SBS_SBH_URL origin is exempt from the public-address rule, so a local SynBioHub works in development.
        required: false
        style: simple
        explode: false
        schema:
          type: string
          format: uri
          example: https://api.synbiohub.org
      requestBody:
        $ref: "#/components/requestBodies/FileUpload"
      responses:
        "200":
          description: "The upload, replace, or attach succeeded."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationResult"
        "400":
          description: |
            Invalid request -- a malformed X-Study-Collection header, a missing file part, an unreadable file, or a workbook that is not a valid Excel-to-SBOL template.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid SynBioHub credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: |
            The study collection named in X-Study-Collection does not exist, or -- for the per-item endpoint -- no such object exists in this collection. An empty collection is not a 404; it is a 200 with an empty array.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: |
            The upload is larger than the server accepts. The limit is MAX_CONTENT_LENGTH, 64 MB by default; set SBS_MAX_UPLOAD_MB to change it per deployment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: |
            The file's format is not one this collection accepts (e.g. an Excel workbook posted to an SBOL-only collection).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: SynBioHub rejected the request or could not be reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: |
            SynBioHub did not answer in time. For a submit, whether the upload was applied is unknown -- SynBioHub may still finish it -- and sending the same request again is safe. Also returned when a workbook's Tyto Lookup columns need Ontobee and it did not answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-openapi-router-controller: swagger_server.controllers.resources_controller
    post:
      tags:
      - Resources
      summary: Add to the resources collection
      description: |
        Objects whose URIs already exist are updated in place; everything else is added. Nothing is removed.
      operationId: create_resources
      parameters:
      - name: X_Study_Collection
        in: header
        description: |
