      summary: Add a new attachment to the pointed SBOL object
      description: |
        The one per-item endpoint in this API -- attaching a file requires naming the specific SBOL object. Maps to SynBioHub's POST <URI>/attach. The attachment is added; an existing attachment of the same name is not removed.
      operationId: attach_to_assay
      parameters:
      - name: X_Study_Collection
        in: header
        description: |
          The SynBioHub collection URI of the study the request applies to -- the study the user selects when opening SynBioSuite. This scopes every collection to one study, which is why no per-item ids are needed elsewhere in this API. Must be of the form <scheme>://<host>/user/<user>/<studyId>/<displayId>/<version>.
        required: true
        style: simple
        explode: false
        schema:
          type: string
          format: uri
          example: https://synbiohub.org/user/alice/MyStudy/MyStudy_collection/1
      - name: X_SynBioHub_Url
        in: header
        description: |
          Base URL of the SynBioHub API to talk to. This is a different host from the one in X-Study-Collection (api.synbiohub.org vs synbiohub.org), so it cannot be derived from it reliably. Falls back to the server's SBS_SBH_URL setting, then to https://api.<study host>. Whichever is used must be an http(s) URL with no query string, fragment or credentials, and its host must resolve to a public address; otherwise the request fails with 400 before anything is sent. The server's own SBS_SBH_URL origin is exempt from the public-address rule, so a local SynBioHub works in development.
        required: false
        style: simple
        explode: false
        schema:
          type: string
          format: uri
          example: https://api.synbiohub.org
      - name: id
        in: path
        description: |
          displayId of the SBOL object to attach to (not its URI or version).
        required: true
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        $ref: "#/components/requestBodies/AttachmentUpload"
      responses:
        "200":
          description: "The upload, replace, or attach succeeded."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationResult"
        "400":
          description: |
            Invalid request -- a malformed X-Study-Collection header, a missing file part, an unreadable file, or a workbook that is not a valid Excel-to-SBOL template.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid SynBioHub credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: |
            The study collection named in X-Study-Collection does not exist, or -- for the per-item endpoint -- no such object exists in this collection. An empty collection is not a 404; it is a 200 with an empty array.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: |
            The upload is larger than the server accepts. The limit is MAX_CONTENT_LENGTH, 64 MB by default; set SBS_MAX_UPLOAD_MB to change it per deployment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: SynBioHub rejected the request or could not be reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-openapi-router-controller: swagger_server.controllers.assays_controller
