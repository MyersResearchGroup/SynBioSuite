[uwsgi]
module = app.connexion_app
callable = application
master = true
processes = 4
; The WSGI adapter runs Connexion's ASGI stack on an event-loop thread. Threads
; do not survive uwsgi's fork, so each worker loads the application itself, and
; uwsgi must allow Python threads at all.
lazy-apps = true
enable-threads = true
; Same reasoning as sbs_server/uwsgi.ini.
harakiri = 180
harakiri-verbose = true
