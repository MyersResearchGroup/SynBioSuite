[uwsgi]
module = app.main
callable = app
master = true
processes = 4
; No `threads` on purpose: one request per worker. sbol2 keeps its homespace
; and validation switch in process-global state, so uploads sharing a process
; have to take turns (utils.SBOL2_LOCK); with threads they would queue behind
; each other's conversions and SynBioHub submits instead of running in parallel.
; Excel->SBOL conversion of a ~283 KB workbook takes ~15 s end to end, so a
; worker must not be killed anywhere near that. 180 s leaves room for larger
; workbooks while still reclaiming a genuinely hung request. Note nginx in the
; base image has its own ~60 s read timeout that is not env-configurable.
harakiri = 180
harakiri-verbose = true
