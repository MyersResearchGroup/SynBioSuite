components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        SynBioHub access token. The server forwards it to SynBioHub as the
        X-authorization header that SynBioHub itself expects.

  parameters:
    StudyCollection:
      name: X-Study-Collection
      in: header
      required: true
      description: >
        The SynBioHub collection URI of the study the request applies to -- the study
        the user selects when opening SynBioSuite. This scopes every collection to one
        study, which is why no per-item ids are needed elsewhere in this API. Must be
        of the form <scheme>://<host>/user/<user>/<studyId>/<displayId>/<version>.
      schema:
        type: string
        format: uri
        example: https://synbiohub.org/user/alice/MyStudy/MyStudy_collection/1
    SynBioHubUrl:
      name: X-SynBioHub-Url
      in: header
      required: false
      description: >
        Base URL of the SynBioHub API to talk to. This is a different host from the
        one in X-Study-Collection (api.synbiohub.org vs synbiohub.org), so it cannot
        be derived from it reliably. Falls back to the server's SBS_SBH_URL setting,
        then to https://api.<study host>.
      schema:
        type: string
        format: uri
        example: https://api.synbiohub.org

  schemas:
    Status:
      type: object
      properties:
        status: { type: string, example: working }
        version: { type: string, example: 1.9.0, description: The running backend's version. }
    Item:
      type: object
      description: One object in a collection. Fields are collection-dependent.
      additionalProperties: true
      properties:
        uri: { type: string, format: uri }
        displayId: { type: string }
        name: { type: string }
        description: { type: string }
        type:
          type: array
          description: SBOL types. Multi-valued, so always an array.
          items: { type: string }
        role:
          type: array
          description: SBOL roles. Multi-valued, so always an array.
          items: { type: string }
    Error:
      type: object
      properties:
        error: { type: string }
    MutationResult:
      type: object
      properties:
        status: { type: string, example: success }
        message: { type: string }

  requestBodies:
    FileUpload:
      required: true
      description: >
        A file -- an Excel template (.xlsx/.xlsm) or SBOL XML (.xml/.rdf/.sbol),
        depending on what the collection accepts -- plus an optional JSON params blob
        for processing options. Excel is converted to SBOL on the way in. Which format
        was sent is determined from the file extension. The target study comes from the
        X-Study-Collection header, not from params.
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file:
                type: string
                format: binary
              params:
                type: string
                description: Optional JSON string of processing parameters.
    AttachmentUpload:
      required: true
      description: A file to attach to one SBOL object.
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file:
                type: string
                format: binary
                description: The attachment to add.

  responses:
    CollectionContents:
      description: >
        All contents of the collection. An empty array means the collection exists
        but has no members -- including the case where the study has no such
        sub-collection yet.
      content:
        application/json:
          schema:
            type: array
            items: { $ref: '#/components/schemas/Item' }
        application/rdf+xml:
          schema: { type: string, format: binary }
    MutationAccepted:
      description: The upload, replace, or attach succeeded.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MutationResult' }
    TemplateFile:
      description: >
        A blank macro-enabled Excel template (.xlsm). Data rows are empty; SBH_*
        lookup sheets are populated from the study.
      content:
        application/vnd.ms-excel.sheet.macroEnabled.12:
          schema: { type: string, format: binary }
    BadRequest:
      description: >
        Invalid request -- a malformed X-Study-Collection header, a missing file part,
        an unreadable file, or a workbook that is not a valid Excel-to-SBOL template.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid SynBioHub credentials.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Not permitted (e.g. you do not own this collection).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: >
        The study collection named in X-Study-Collection does not exist, or -- for
        the per-item endpoint -- no such object exists in this collection. An empty
        collection is not a 404; it is a 200 with an empty array.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnsupportedMediaType:
      description: >
        The file's format is not one this collection accepts (e.g. an Excel workbook
        posted to an SBOL-only collection).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

    PayloadTooLarge:
      description: >
        The upload is larger than the server accepts. The limit is MAX_CONTENT_LENGTH,
        64 MB by default; set SBS_MAX_UPLOAD_MB to change it per deployment.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotImplemented:
      description: This collection is not specified yet.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadGateway:
      description: SynBioHub rejected the request or could not be reached.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
