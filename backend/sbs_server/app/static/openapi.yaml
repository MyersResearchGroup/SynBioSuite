openapi: 3.0.3

info:
  title: SynBioSuite API
  version: 1.0.0
  description: >
    Bulk, collection-level REST API for SynBioSuite. Each collection exposes
    GET (get all contents), POST (add), PUT (replace all contents), and
    DELETE (empty). Excel-backed collections also expose GET /template.


    Per-item access (fetch or edit a single object by id) is delegated to the
    SynBioHub API, which is the system of record for individual objects. The one
    exception is PATCH /assays/{id}/attachments, which attaches a file to a
    specific SBOL object and therefore must name that object.


    Every request carries the study it applies to in the X-Study-Collection header
    (the SynBioHub collection selected when opening SynBioSuite). That study scopes
    all collections, which is why this API needs no per-item ids elsewhere. Because
    the SynBioHub API host differs from the host in that collection URI
    (api.synbiohub.org vs synbiohub.org), the API base is supplied separately in
    X-SynBioHub-Url.


    Uploads take a single `file` part. Collections that accept both formats detect
    which from the file extension; Excel is converted to SBOL on ingest.


    DELETE empties a collection by removing its members' membership. The
    sub-collection object survives and the SBOL objects themselves are not
    destroyed, so a subsequent GET returns an empty array rather than 404. A 404
    means the study collection itself does not exist.


    This version number is the API contract's; GET /status reports the running
    backend's version, which is tracked separately.


    TBD collections, present but not yet specified: /models (SBML), /archives
    (OMEX), /analyses (iBioSim). They answer 501.


    Trying it out: open these docs from a running server, click Authorize and
    paste a SynBioHub token, then on any operation click Try it out, paste your
    study's collection URI into X-Study-Collection, and Execute. Leave
    X-SynBioHub-Url blank -- the server derives https://api.<study host>. PUT and
    DELETE change real data; point them at a scratch study.

servers:
  - url: /api/v1
    description: The server hosting these docs
  - url: http://127.0.0.1:5003/api/v1
    description: Local SBS server

tags:
  - name: System
  - name: Resources
  - name: Devices
  - name: Designs
  - name: Plasmids
  - name: Strains
  - name: Sample Designs
  - name: Assays
  - name: Models
  - name: Archives
  - name: Analyses

security:
  - bearerAuth: []

paths:

  /status:
    get:
      tags: [System]
      operationId: getStatus
      summary: Check the API is running
      security: []
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }

  # resources (Excel and SBOL) -----------------------------------------------
  /resources:
    parameters:
      - $ref: '#/components/parameters/StudyCollection'
      - $ref: '#/components/parameters/SynBioHubUrl'
    get:
      tags: [Resources]
      operationId: listResources
      summary: Get all the contents of the resources collection
      description: >
        Returns an empty array when the study has no such sub-collection yet,
        which is the normal state of a freshly created study.
      responses:
        '200': { $ref: '#/components/responses/CollectionContents' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/BadGateway' }
    post:
      tags: [Resources]
      operationId: createResources
      summary: Add to the resources collection
      description: >
        Objects whose URIs already exist are updated in place; everything else
        is added. Nothing is removed.
      requestBody: { $ref: '#/components/requestBodies/FileUpload' }
      responses:
        '201': { $ref: '#/components/responses/MutationAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '502': { $ref: '#/components/responses/BadGateway' }
    put:
      tags: [Resources]
      operationId: replaceResources
      summary: Replace the resources collection contents
      description: >
        After this call the collection contains exactly what was uploaded.
      requestBody: { $ref: '#/components/requestBodies/FileUpload' }
      responses:
        '200': { $ref: '#/components/responses/MutationAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '502': { $ref: '#/components/responses/BadGateway' }
    delete:
      tags: [Resources]
      operationId: clearResources
      summary: Empty the resources collection
      description: >
        Removes every member from the collection. The sub-collection object
        itself survives, and the SBOL objects are not destroyed -- only their
        membership is removed. A subsequent GET returns an empty array.
      responses:
        '204': { description: Collection emptied. The sub-collection itself remains. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /resources/template:
    parameters:
      - $ref: '#/components/parameters/StudyCollection'
      - $ref: '#/components/parameters/SynBioHubUrl'
    get:
      tags: [Resources]
      operationId: getResourcesTemplate
      summary: Download the blank Excel template for resources
      description: >
        A blank workbook: the data rows are empty. Its SBH_* lookup sheets are
        populated with URIs from this study so the sheet can cross-reference
        objects that already exist. To retrieve existing contents, use GET
        /resources instead.
      responses:
        '200': { $ref: '#/components/responses/TemplateFile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/BadGateway' }
