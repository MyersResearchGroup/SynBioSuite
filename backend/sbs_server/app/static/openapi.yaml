        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /assays/template:
    parameters:
      - $ref: '#/components/parameters/StudyCollection'
      - $ref: '#/components/parameters/SynBioHubUrl'
    get:
      tags: [Assays]
      operationId: getAssaysTemplate
      summary: Download the blank Excel template for assays
      description: >
        A blank workbook: the data rows are empty. Its SBH_* lookup sheets are
        populated with URIs from this study so the sheet can cross-reference
        objects that already exist. To retrieve existing contents, use GET
        /assays instead.
      responses:
        '200': { $ref: '#/components/responses/TemplateFile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/BadGateway' }
  /assays/{id}/attachments:
    parameters:
      - $ref: '#/components/parameters/StudyCollection'
      - $ref: '#/components/parameters/SynBioHubUrl'
      - name: id
        in: path
        required: true
        description: >
          displayId of the SBOL object to attach to. Its full URI is also accepted.
        schema: { type: string }
    patch:
      tags: [Assays]
      operationId: attachToAssay
      summary: Add a new attachment to the pointed SBOL object
      description: >
        The one per-item endpoint in this API -- attaching a file requires naming the
        specific SBOL object. Maps to SynBioHub's POST <URI>/attach. The attachment is
        added; an existing attachment of the same name is not removed.
      requestBody: { $ref: '#/components/requestBodies/AttachmentUpload' }
      responses:
        '200': { $ref: '#/components/responses/MutationAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '502': { $ref: '#/components/responses/BadGateway' }
  # models (SBML, not yet specified) -----------------------------------------
  /models:
    parameters:
      - $ref: '#/components/parameters/StudyCollection'
      - $ref: '#/components/parameters/SynBioHubUrl'
    get:
      tags: [Models]
      operationId: listModels
      summary: "[TBD] Get all the contents of the models collection"
      responses:
        '501': { $ref: '#/components/responses/NotImplemented' }
    post:
      tags: [Models]
      operationId: createModels
      summary: "[TBD] Add to the models collection"
      responses:
        '501': { $ref: '#/components/responses/NotImplemented' }
    put:
      tags: [Models]
      operationId: replaceModels
      summary: "[TBD] Replace the models collection contents"
      responses:
        '501': { $ref: '#/components/responses/NotImplemented' }
    delete:
      tags: [Models]
      operationId: clearModels
      summary: "[TBD] Empty the models collection"
      responses:
        '501': { $ref: '#/components/responses/NotImplemented' }
  # archives (OMEX, not yet specified) ---------------------------------------
  /archives:
