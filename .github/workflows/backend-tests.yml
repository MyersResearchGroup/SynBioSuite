name: Backend tests

# The suite is the main evidence the API works, and until now it only ran on a
# developer laptop -- both existing workflows build an image without testing it.
on:
  pull_request:
    paths: ['backend/**']
  push:
    branches: [master]
    paths: ['backend/**']
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'   # matches the Docker base image

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        working-directory: backend
        # Live tests skip automatically: they require backend/.env.test, which is
        # gitignored and holds a real SynBioHub token.
        run: python -m pytest -q
